name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: guitare_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d guitare_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/guitare_app_test?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/guitare_app_test?schema=public
      JWT_SECRET: ci-only-secret-containing-at-least-32-characters
      APP_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_TLS: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -r workers/transcription/requirements.txt
          pip-audit -r workers/stems/requirements.txt
          pip-audit -r workers/stems/requirements-uvr.txt
          pip-audit -r workers/stems/requirements-uvr-trained.txt
          pip-audit -r workers/chords/requirements.txt
          pip-audit -r requirements.youtube.txt
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: bun run prisma:deploy
      - run: bun run validate
      - run: bun run test:e2e --runInBand
      - run: python -m unittest discover -s workers/transcription/tests -v
      - run: python -m unittest discover -s workers/stems/tests -v
      - name: Build production backend image
        run: docker build -t flowfret-backend:${{ github.sha }} .
      - name: Scan repository history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          git /repo --redact --no-banner
      - name: Scan backend image for high and critical vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL
          flowfret-backend:${{ github.sha }}
