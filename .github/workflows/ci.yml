name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: guitare_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d guitare_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/guitare_app_test?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/guitare_app_test?schema=public
      JWT_SECRET: ci-only-secret-containing-at-least-32-characters
      APP_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_TLS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run validate
      - run: npm run test:e2e -- --runInBand
      - run: python -m unittest discover -s workers/transcription/tests -v
