services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: guitare_app
    ports: ['127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432']
    volumes: [guitare_pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d guitare_app']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:${REDIS_HOST_PORT:-6379}:6379']
    volumes: [guitare_redis_data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ${BACKEND_ENV_FILE:-.env}
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-production}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/guitare_app?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/guitare_app?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_PRIVATE_URL: ''
      REDIS_HOST: redis
      REDIS_TLS: 'false'
      YOUTUBE_DL_PYTHON_BIN: python3
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Generates YouTube proof-of-origin tokens so yt-dlp extractions succeed
  # without depending on a human-exported, periodically-expiring cookie
  # session. Lightweight (plain JS runtime, no headless browser). Not
  # published to the host: only transcription-worker/stems-worker reach it,
  # over the compose network, by service name.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    restart: unless-stopped

  transcription-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: ${BACKEND_ENV_FILE:-.env}
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-production}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/guitare_app?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/guitare_app?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_PRIVATE_URL: ''
      REDIS_HOST: redis
      REDIS_TLS: 'false'
      YOUTUBE_DL_PYTHON_BIN: python3
      HF_HOME: /models
      TRANSCRIPTION_TEMP_DIR: /transcription-tmp
      YOUTUBE_POT_PROVIDER_URL: http://pot-provider:4416
    volumes:
      - whisper_models:/models
      - transcription_tmp:/transcription-tmp
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      pot-provider: { condition: service_started }

  stems-worker:
    build:
      context: .
      dockerfile: Dockerfile.stems
    restart: unless-stopped
    env_file: ${BACKEND_ENV_FILE:-.env}
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-production}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/guitare_app?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/guitare_app?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_PRIVATE_URL: ''
      REDIS_HOST: redis
      REDIS_TLS: 'false'
      AUDIO_STEMS_TEMP_DIR: /stems-tmp
      TORCH_HOME: /models
      YOUTUBE_POT_PROVIDER_URL: http://pot-provider:4416
    # Placeholder safety net, not a tuned value: no Demucs benchmark has been
    # run on target hardware yet. Re-set these once Etape 0 of the karaoke
    # plan (manual CPU/RAM benchmark) has real numbers.
    mem_limit: 2g
    cpus: '2.0'
    volumes:
      - demucs_models:/models
      - stems_tmp:/stems-tmp
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      pot-provider: { condition: service_started }

volumes:
  guitare_pg_data:
  guitare_redis_data:
  whisper_models:
  transcription_tmp:
  demucs_models:
  stems_tmp:
