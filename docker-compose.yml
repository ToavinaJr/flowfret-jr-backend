services:
  db:
    image: postgres:16-alpine
    container_name: guitare-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: guitare_app
    ports:
      - "5434:5432"
    volumes:
      - guitare_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guitare_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  guitare_pg_data:
